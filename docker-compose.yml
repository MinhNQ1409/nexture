services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - nexture_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexture"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend/Nexture.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=nexture;Username=postgres;Password=postgres
      Jwt__Issuer: nexture
      Jwt__Key: DEV_ONLY_CHANGE_THIS_KEY_12345678901234567890
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nexture_uploads:/app/uploads

  web:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8080/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  nexture_pg:
  nexture_uploads:
