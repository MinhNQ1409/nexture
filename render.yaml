services:
  - type: web
    name: nexture-api
    runtime: docker
    dockerfilePath: backend/Nexture.Api/Dockerfile
    dockerContext: backend/Nexture.Api
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: nexture-db
          property: connectionString
      - key: Jwt__Issuer
        value: nexture
      - key: Jwt__Key
        generateValue: true

databases:
  - name: nexture-db
    plan: free
    region: singapore
    databaseName: nexture
    user: nexture_user
